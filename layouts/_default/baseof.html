<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="rtl">
<head>
  {{- partial "head.html" . }}
</head>
<body class="dark" id="top">
  {{- partial "header.html" . }}
  <div class="delkash-layout{{ if .IsHome }} dk-full{{ end }}">
    <main id="main" class="main">
      {{- block "main" . }}{{ end }}
    </main>
    {{- if not .IsHome }}
    {{- partial "sidebar.html" . }}
    {{- end }}
  </div>
  {{- partial "footer.html" . }}
  {{- partial "extend_footer.html" . }}
</body>
</html>
